# The container replaces @GS_HTTP_PORT@ with the validated public port at startup.
map $http_upgrade $ground_station_connection {
    default upgrade;
    ''      close;
}

# Keep the external HTTPS scheme when another reverse proxy sits in front.
map $http_x_forwarded_proto $ground_station_scheme {
    default $scheme;
    ~*^https$ https;
}

# Combine local wall time with milliseconds to match Python's logging timestamp.
map "$time_iso8601 $msec" $ground_station_log_time {
    default $time_iso8601;
    "~^(?<gs_log_date>[0-9-]+)T(?<gs_log_clock>[0-9:]+)[^ ]+ [0-9]+\.(?<gs_log_msec>[0-9]+)$"
        "$gs_log_date $gs_log_clock,$gs_log_msec";
}

# Match the backend's green/yellow/red severity palette for HTTP failures.
map $status $ground_station_log_level {
    default "INFO    ";
    ~^4     "WARNING ";
    ~^5     "ERROR   ";
}

map $status $ground_station_log_level_color {
    default 32;
    ~^4     33;
    ~^5     31;
}

# Informational responses and redirects are cyan; successful requests are green.
map $status $ground_station_log_status_color {
    default 36;
    ~^2     32;
    ~^4     33;
    ~^5     31;
}

# configure.sh supplies literal ANSI escapes in the format, not in variables.
# Keep Nginx's default variable escaping so request data cannot inject terminal codes.
log_format ground_station '[$ground_station_log_time] -         nginx.access - '
                          '@GS_LOG_ESC@[${ground_station_log_level_color}m$ground_station_log_level@GS_LOG_ESC@[0m '
                          '@GS_LOG_ESC@[36m$remote_addr@GS_LOG_ESC@[0m - $remote_user '
                          '"@GS_LOG_ESC@[34m$request@GS_LOG_ESC@[0m" '
                          '@GS_LOG_ESC@[1;${ground_station_log_status_color}m$status@GS_LOG_ESC@[0m '
                          '@GS_LOG_ESC@[35m$body_bytes_sent@GS_LOG_ESC@[0m '
                          '@GS_LOG_ESC@[90m"$http_referer" "$http_user_agent"@GS_LOG_ESC@[0m';

upstream ground_station_backend {
    server 127.0.0.1:7001;
    # Do not reuse a backend connection that a forked worker may have inherited.
    # WebSockets and event streams still retain their connection for the request.
}

server {
    listen @GS_HTTP_PORT@;
    listen [::]:@GS_HTTP_PORT@;
    server_name _;
    server_tokens off;

    access_log /dev/stdout ground_station;
    error_log /dev/stderr warn;

    # Only a local reverse proxy may supply the original client address.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    location = /__lobby.html {
        internal;
        alias /app/lobby/lobby.html;
        add_header Cache-Control "no-store" always;
    }

    location = /__lobby-logo.png {
        alias /app/lobby/logo.png;
        add_header Cache-Control "public, max-age=3600";
    }

    location / {
        proxy_pass http://ground_station_backend;
        proxy_http_version 1.1;

        # Preserve the browser's port for Socket.IO's same-origin check.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $ground_station_scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $ground_station_connection;

        # Keep event streams, WebSockets, and large maintenance uploads intact.
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        client_max_body_size 0;

        # Keep the upstream error status so API checks cannot mistake the lobby for readiness.
        proxy_intercept_errors on;
        error_page 502 504 /__lobby.html;
    }
}
